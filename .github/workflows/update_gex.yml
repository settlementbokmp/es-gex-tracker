name: Daily GEX Auto-Calculator

on:
  schedule:
    # اجرا در ساعات معاملاتی بازار آمریکا (به وقت UTC)
    - cron: '30 12,15,18 * * 1-5'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pandas numpy yfinance

      - name: Run GEX script
        run: python gex_calculator.py

      - name: Commit and push updated GEX levels
        run: |
          git config --global user.name "GEX Bot"
          git config --global user.email "bot@github.com"
          git add gex_levels.csv
          git commit -m "Auto-update GEX levels and market regime [skip ci]" || exit 0
          git push
